<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Dark Palette & Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accent-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #22D3EE; #10B981; #7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE; #10B981; #7C3AED; #22D3EE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981; #7C3AED; #22D3EE; #10B981" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ascii-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="panel-border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>

    <linearGradient id="glass-reflection-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <radialGradient id="glow-purple" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters & Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="canvas-clip">
      <rect width="1180" height="610" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    
    /* Typing Effect Animations */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 0.8s infinite; }

    /* ASCII Line-by-Line Reveal */
    .ascii-line { opacity: 0; animation: lineReveal 0.1s forwards; }
    @keyframes lineReveal { to { opacity: 1; } }

    /* Sequential Text Fade Up */
    .fade-up { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating Effect */
    .float-slow { animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <g clip-path="url(#canvas-clip)">
    <!-- Canvas Background -->
    <rect width="1180" height="610" fill="url(#bg-grad-dark)"/>
    <rect width="1180" height="610" fill="url(#glow-purple)"/>
    <rect width="1180" height="610" fill="url(#glow-cyan)"/>
    <rect width="1180" height="610" fill="url(#dot-grid)"/>

    <!-- Floating Background Particles -->
    <circle cx="150" cy="120" r="2" fill="#22D3EE" opacity="0.4">
      <animate attributeName="cy" values="120;100;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="480" r="1.5" fill="#7C3AED" opacity="0.5">
      <animate attributeName="cy" values="480;500;480" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="80" r="2.5" fill="#10B981" opacity="0.3">
      <animate attributeName="cx" values="550;570;550" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Card Border Shimmer -->
    <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#panel-border-dark)" stroke-width="1.5"/>

    <!-- ================= LEFT PANEL (ASCII &amp; CYBER TERMINAL) ================= -->
    <g transform="translate(32, 32)">
      <!-- Glass Container -->
      <rect width="410" height="546" rx="16" fill="#0F172A" fill-opacity="0.5" filter="url(#soft-shadow)"/>
      <rect width="410" height="546" rx="16" fill="url(#glass-reflection-dark)"/>
      <rect width="410" height="546" rx="16" fill="none" stroke="url(#panel-border-dark)" stroke-width="1"/>

      <!-- Terminal Header -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 394 0 A 16 16 0 0 1 410 16 L 410 40 L 0 40 Z" fill="rgba(255,255,255,0.03)"/>
      <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="205" y="24" fill="#64748B" class="font-mono" font-size="11" text-anchor="middle" letter-spacing="1">AVATAR.SYS</text>

      <!-- ASCII Art Container with Floating Animation -->
      <g class="float-slow" transform="translate(25, 75)">
        <!-- Glowing Backdrop for ASCII -->
        <rect x="10" y="10" width="340" height="380" fill="url(#glow-purple)" opacity="0.5" filter="url(#glow)"/>

        <!-- ASCII Text Matrix -->
        <g fill="url(#ascii-grad-dark)" class="font-mono" font-size="10" font-weight="bold" xml:space="preserve">
          <text x="0" y="20" class="ascii-line" style="animation-delay: 0.1s;">        .::-======-::.        </text>
          <text x="0" y="32" class="ascii-line" style="animation-delay: 0.2s;">      :-===============:-     </text>
          <text x="0" y="44" class="ascii-line" style="animation-delay: 0.3s;">    .-===================-.   </text>
          <text x="0" y="56" class="ascii-line" style="animation-delay: 0.4s;">   :=---------------------=:  </text>
          <text x="0" y="68" class="ascii-line" style="animation-delay: 0.5s;">  .-====+**========**+====-.  </text>
          <text x="0" y="80" class="ascii-line" style="animation-delay: 0.6s;">  :====*@@@@*====*@@@@*====:  </text>
          <text x="0" y="92" class="ascii-line" style="animation-delay: 0.7s;">  :====%@@@@%====%@@@@%====:  </text>
          <text x="0" y="104" class="ascii-line" style="animation-delay: 0.8s;">  :====+*%&amp;#*====*&amp;#%*+====:  </text>
          <text x="0" y="116" class="ascii-line" style="animation-delay: 0.9s;">  .=============-==========.  </text>
          <text x="0" y="128" class="ascii-line" style="animation-delay: 1.0s;">   :=--------.---.--------=:  </text>
          <text x="0" y="140" class="ascii-line" style="animation-delay: 1.1s;">    .-=======:===:=======-.   </text>
          <text x="0" y="152" class="ascii-line" style="animation-delay: 1.2s;">      :-=============:-       </text>
          <text x="0" y="164" class="ascii-line" style="animation-delay: 1.3s;">        .::-======-::.        </text>
          <text x="0" y="184" class="ascii-line" style="animation-delay: 1.4s;">      .-===============:-     </text>
          <text x="0" y="196" class="ascii-line" style="animation-delay: 1.5s;">    .#@@@@@@@@@@@@@@@@@@@#.   </text>
          <text x="0" y="208" class="ascii-line" style="animation-delay: 1.6s;">   -%@@@@@@@@@@@@@@@@@@@@@%-  </text>
          <text x="0" y="220" class="ascii-line" style="animation-delay: 1.7s;">  +%@@@@@@@@@@@@@@@@@@@@@@@%+ </text>
          <text x="0" y="232" class="ascii-line" style="animation-delay: 1.8s;">  *@@@@@@@@@@@@@@@@@@@@@@@@@* </text>
          <text x="0" y="244" class="ascii-line" style="animation-delay: 1.9s;">  *@@@@@@@@@@@@@@@@@@@@@@@@@* </text>
          <text x="0" y="256" class="ascii-line" style="animation-delay: 2.0s;">  =@%--------------------%@= </text>
        </g>
      </g>

      <!-- Scanline Sweep Effect -->
      <rect x="1" y="41" width="408" height="4" fill="url(#accent-grad-dark)" opacity="0.4" filter="url(#glow)">
        <animate attributeName="y" values="41;500;41" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- Sub-Terminal Cyber Metric -->
      <g transform="translate(20, 485)" class="font-mono" font-size="11">
        <rect width="370" height="42" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
        <text x="15" y="25" fill="#10B981">● SYSTEM_ONLINE</text>
        <text x="355" y="25" fill="#64748B" text-anchor="end">LOC: 23.68°N 86.98°E</text>
      </g>
    </g>

    <!-- ================= RIGHT PANEL (MAIN CONTENT) ================= -->
    <g transform="translate(466, 32)">
      <!-- Glass Terminal Panel -->
      <rect width="682" height="546" rx="16" fill="#0F172A" fill-opacity="0.5" filter="url(#soft-shadow)"/>
      <rect width="682" height="546" rx="16" fill="url(#glass-reflection-dark)"/>
      <rect width="682" height="546" rx="16" fill="none" stroke="url(#panel-border-dark)" stroke-width="1"/>

      <!-- Window Topbar -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 666 0 A 16 16 0 0 1 682 16 L 682 40 L 0 40 Z" fill="rgba(255,255,255,0.03)"/>
      <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="341" y="24" fill="#64748B" class="font-mono" font-size="11" text-anchor="middle" letter-spacing="1">developer-profile.sh</text>

      <!-- Greeting &amp; Name -->
      <g transform="translate(40, 80)">
        <text x="0" y="0" fill="#94A3B8" class="font-sans" font-size="18" font-weight="500" class="fade-up" style="animation-delay: 0.2s;">
          Hi 👋, I'm
        </text>
        <text x="0" y="42" fill="#F8FAFC" class="font-sans" font-size="38" font-weight="800" letter-spacing="-0.5" class="fade-up" style="animation-delay: 0.4s;">
          Apurba Roy
        </text>
      </g>

      <!-- Animated Typing Text -->
      <g transform="translate(40, 158)" class="font-mono" font-size="20" font-weight="600">
        <text x="0" y="0" fill="#22D3EE">&gt;</text>
        
        <g transform="translate(24, 0)">
          <text fill="url(#accent-grad-dark)">
            <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            Full Stack Software Engineer
          </text>
          <text fill="url(#accent-grad-dark)">
            <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            AI &amp; Agentic Systems Architect
          </text>
          <text fill="url(#accent-grad-dark)">
            <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            Open Source Contributor
          </text>
        </g>
        
        <rect x="360" y="-16" width="10" height="22" fill="#22D3EE" class="cursor"/>
      </g>

      <!-- Key Details Grid -->
      <g transform="translate(40, 205)" class="font-sans" font-size="14">
        <g class="fade-up" style="animation-delay: 0.6s;">
          <text x="0" y="15" fill="#94A3B8" class="font-mono" font-size="12">LOCATION</text>
          <text x="140" y="15" fill="#F8FAFC" font-weight="500">Asansol, India</text>
        </g>
        <g transform="translate(0, 32)" class="fade-up" style="animation-delay: 0.7s;">
          <text x="0" y="15" fill="#94A3B8" class="font-mono" font-size="12">EDUCATION</text>
          <text x="140" y="15" fill="#F8FAFC" font-weight="500">B.Tech in Information Technology</text>
        </g>
        <g transform="translate(0, 64)" class="fade-up" style="animation-delay: 0.8s;">
          <text x="0" y="15" fill="#94A3B8" class="font-mono" font-size="12">CURRENT FOCUS</text>
          <text x="140" y="15" fill="#22D3EE" font-weight="500">HireOps (Agentic AI Evaluation SaaS)</text>
        </g>
      </g>

      <!-- Tech Stack Pills -->
      <g transform="translate(40, 335)">
        <text x="0" y="0" fill="#64748B" class="font-mono" font-size="11" letter-spacing="1" class="fade-up" style="animation-delay: 0.9s;">
          PRIMARY TECH STACK
        </text>

        <g transform="translate(0, 15)" class="fade-up" style="animation-delay: 1.0s;">
          <g transform="translate(0, 0)">
            <rect width="82" height="30" rx="15" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
            <text x="41" y="19" fill="#F8FAFC" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Next.js</text>
          </g>
          <g transform="translate(90, 0)">
            <rect width="72" height="30" rx="15" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.3)"/>
            <text x="36" y="19" fill="#22D3EE" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">React</text>
          </g>
          <g transform="translate(170, 0)">
            <rect width="98" height="30" rx="15" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)"/>
            <text x="49" y="19" fill="#60A5FA" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">TypeScript</text>
          </g>
          <g transform="translate(276, 0)">
            <rect width="78" height="30" rx="15" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
            <text x="39" y="19" fill="#FBBF24" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Python</text>
          </g>
          <g transform="translate(362, 0)">
            <rect width="64" height="30" rx="15" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)"/>
            <text x="32" y="19" fill="#F87171" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Java</text>
          </g>
          <g transform="translate(434, 0)">
            <rect width="84" height="30" rx="15" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
            <text x="42" y="19" fill="#34D399" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Tailwind</text>
          </g>

          <g transform="translate(0, 38)">
            <g transform="translate(0, 0)">
              <rect width="92" height="30" rx="15" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)"/>
              <text x="46" y="19" fill="#C084FC" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">LangGraph</text>
            </g>
            <g transform="translate(100, 0)">
              <rect width="80" height="30" rx="15" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.3)"/>
              <text x="40" y="19" fill="#4ADE80" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Node.js</text>
            </g>
            <g transform="translate(188, 0)">
              <rect width="90" height="30" rx="15" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
              <text x="45" y="19" fill="#10B981" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">MongoDB</text>
            </g>
            <g transform="translate(286, 0)">
              <rect width="76" height="30" rx="15" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.3)"/>
              <text x="38" y="19" fill="#38BDF8" class="font-sans" font-size="12" font-weight="500" text-anchor="middle">Docker</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Social Icons -->
      <g transform="translate(40, 468)" class="fade-up" style="animation-delay: 1.1s;">
        <line x1="0" y1="0" x2="602" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <g transform="translate(0, 18)">
          <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
          <path d="M16 8a8 8 0 00-2.53 15.59c.4.07.55-.17.55-.38v-1.35c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .22.15.46.55.38A8 8 0 0016 8z" fill="#F8FAFC"/>
        </g>

        <g transform="translate(48, 18)">
          <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
          <path d="M11 11h2.5v1.4h.04c.35-.66 1.2-1.35 2.48-1.35 2.65 0 3.14 1.74 3.14 4V21H16.5v-4.3c0-1.02-.02-2.34-1.42-2.34-1.43 0-1.65 1.12-1.65 2.26V21H11V11zM8 21H5.5V11H8v10zM6.75 9.8a1.45 1.45 0 110-2.9 1.45 1.45 0 010 2.9z" fill="#38BDF8"/>
        </g>

        <g transform="translate(96, 18)">
          <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
          <path d="M18.25 9h2.38l-5.2 5.94L21.56 23h-4.79l-3.75-4.91L8.72 23H6.33l5.56-6.35L5.69 9h4.91l3.39 4.49L18.25 9zm-.83 12.57h1.32L9.75 10.33H8.33l9.09 11.24z" fill="#F8FAFC"/>
        </g>

        <text x="590" y="38" fill="#64748B" class="font-mono" font-size="11" text-anchor="end">READY TO COLLABORATE</text>
      </g>
    </g>
  </g>
</svg>
