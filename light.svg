<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Light Palette & Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB; #06B6D4; #10B981; #2563EB" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4; #10B981; #2563EB; #06B6D4" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981; #2563EB; #06B6D4; #10B981" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="ascii-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="panel-border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.12)"/>
      <stop offset="50%" stop-color="rgba(15,23,42,0.03)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.08)"/>
    </linearGradient>

    <linearGradient id="glass-reflection-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)"/>
    </linearGradient>

    <radialGradient id="glow-blue-light" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-teal-light" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters & Effects -->
    <filter id="soft-shadow-light">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <pattern id="dot-grid-light" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0F172A" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="canvas-clip-light">
      <rect width="1180" height="610" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 0.8s infinite; }

    .ascii-line { opacity: 0; animation: lineReveal 0.1s forwards; }
    @keyframes lineReveal { to { opacity: 1; } }

    .fade-up { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .float-slow { animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <g clip-path="url(#canvas-clip-light)">
    <!-- Canvas Background -->
    <rect width="1180" height="610" fill="url(#bg-grad-light)"/>
    <rect width="1180" height="610" fill="url(#glow-blue-light)"/>
    <rect width="1180" height="610" fill="url(#glow-teal-light)"/>
    <rect width="1180" height="610" fill="url(#dot-grid-light)"/>

    <!-- Subtle Floating Ambient Particles -->
    <circle cx="140" cy="110" r="2.5" fill="#2563EB" opacity="0.3">
      <animate attributeName="cy" values="110;90;110" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="470" r="2" fill="#06B6D4" opacity="0.4">
      <animate attributeName="cy" values="470;490;470" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Border Outer Shimmer -->
    <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#panel-border-light)" stroke-width="1.5"/>

    <!-- ================= LEFT PANEL (ASCII & CYBER TERMINAL) ================= -->
    <g transform="translate(32, 32)">
      <!-- Light Glass Panel -->
      <rect width="410" height="546" rx="16" fill="#FFFFFF" fill-opacity="0.7" filter="url(#soft-shadow-light)"/>
      <rect width="410" height="546" rx="16" fill="url(#glass-reflection-light)"/>
      <rect width="410" height="546" rx="16" fill="none" stroke="url(#panel-border-light)" stroke-width="1"/>

      <!-- Header Bar -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 394 0 A 16 16 0 0 1 410 16 L 410 40 L 0 40 Z" fill="rgba(15,23,42,0.03)"/>
      <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="205" y="24" fill="#64748B" class="font-mono" font-size="11" text-anchor="middle" letter-spacing="1">AVATAR.SYS</text>

      <!-- Floating ASCII Graphic -->
      <g class="float-slow" transform="translate(25, 75)">
        <g fill="url(#ascii-grad-light)" class="font-mono" font-size="10" font-weight="bold" xml:space="preserve">
          <text x="0" y="20" class="ascii-line" style="animation-delay: 0.1s;">        .::-======-::.        </text>
          <text x="0" y="32" class="ascii-line" style="animation-delay: 0.2s;">      :-===============:-     </text>
          <text x="0" y="44" class="ascii-line" style="animation-delay: 0.3s;">    .-===================-.   </text>
          <text x="0" y="56" class="ascii-line" style="animation-delay: 0.4s;">   :=---------------------=:  </text>
          <text x="0" y="68" class="ascii-line" style="animation-delay: 0.5s;">  .-====+**========**+====-.  </text>
          <text x="0" y="80" class="ascii-line" style="animation-delay: 0.6s;">  :====*@@@@*====*@@@@*====:  </text>
          <text x="0" y="92" class="ascii-line" style="animation-delay: 0.7s;">  :====%@@@@%====%@@@@%====:  </text>
          <text x="0" y="104" class="ascii-line" style="animation-delay: 0.8s;">  :====+*%&#*====*&#%*+====:  </text>
          <text x="0" y="116" class="ascii-line" style="animation-delay: 0.9s;">  .=============-==========.  </text>
          <text x="0" y="128" class="ascii-line" style="animation-delay: 1.0s;">   :=--------.---.--------=:  </text>
          <text x="0" y="140" class="ascii-line" style="animation-delay: 1.1s;">    .-=======:===:=======-.   </text>
          <text x="0" y="152" class="ascii-line" style="animation-delay: 1.2s;">      :-=============:-       </text>
          <text x="0" y="164" class="ascii-line" style="animation-delay: 1.3s;">        .::-======-::.        </text>
          <text x="0" y="184" class="ascii-line" style="animation-delay: 1.4s;">      .-===============:-     </text>
          <text x="0" y="196" class="ascii-line" style="animation-delay: 1.5s;">    .#@@@@@@@@@@@@@@@@@@@#.   </text>
          <text x="0" y="208" class="ascii-line" style="animation-delay: 1.6s;">   -%@@@@@@@@@@@@@@@@@@@@@%-  </text>
          <text x="0" y="220" class="ascii-line" style="animation-delay: 1.7s;">  +%@@@@@@@@@@@@@@@@@@@@@@@%+ </text>
          <text x="0" y="232" class="ascii-line" style="animation-delay: 1.8s;">  *@@@@@@@@@@@@@@@@@@@@@@@@@* </text>
          <text x="0" y="244" class="ascii-line" style="animation-delay: 1.9s;">  *@@@@@@@@@@@@@@@@@@@@@@@@@* </text>
          <text x="0" y="256" class="ascii-line" style="animation-delay: 2.0s;">  =@%--------------------%@= </text>
        </g>
      </g>

      <!-- Light Scanline Sweep -->
      <rect x="1" y="41" width="408" height="3" fill="url(#accent-grad-light)" opacity="0.5">
        <animate attributeName="y" values="41;500;41" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- Metric Box -->
      <g transform="translate(20, 485)" class="font-mono" font-size="11">
        <rect width="370" height="42" rx="8" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.06)"/>
        <text x="15" y="25" fill="#059669">● SYSTEM_ONLINE</text>
        <text x="355" y="25" fill="#64748B" text-anchor="end">LOC: 23.68°N 86.98°E</text>
      </g>
    </g>

    <!-- ================= RIGHT PANEL (MAIN CONTENT) ================= -->
    <g transform="translate(466, 32)">
      <!-- Glass Terminal Panel -->
      <rect width="682" height="546" rx="16" fill="#FFFFFF" fill-opacity="0.7" filter="url(#soft-shadow-light)"/>
      <rect width="682" height="546" rx="16" fill="url(#glass-reflection-light)"/>
      <rect width="682" height="546" rx="16" fill="none" stroke="url(#panel-border-light)" stroke-width="1"/>

      <!-- Window Topbar -->
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 666 0 A 16 16 0 0 1 682 16 L 682 40 L 0 40 Z" fill="rgba(15,23,42,0.03)"/>
      <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="40" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10B981" opacity="0.8"/>
      <text x="341" y="24" fill="#64748B" class="font-mono" font-size="11" text-anchor="middle" letter-spacing="1">developer-profile.sh</text>

      <!-- Greeting & Name -->
      <g transform="translate(40, 80)">
        <text x="0" y="0" fill="#475569" class="font-sans" font-size="18" font-weight="500" class="fade-up" style="animation-delay: 0.2s;">
          Hi 👋, I'm
        </text>
        <text x="0" y="42" fill="#0F172A" class="font-sans" font-size="38" font-weight="800" letter-spacing="-0.5" class="fade-up" style="animation-delay: 0.4s;">
          Apurba Roy
        </text>
      </g>

      <!-- Animated Typing Text (Role Switcher) -->
      <g transform="translate(40, 158)" class="font-mono" font-size="20" font-weight="600">
        <text x="0" y="0" fill="#2563EB">&gt;</text>
        
        <g transform="translate(24, 0)">
          <text fill="url(#accent-grad-light)">
            <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            Full Stack Software Engineer
          </text>
          <text fill="url(#accent-grad-light)">
            <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            AI &amp; Agentic Systems Architect
          </text>
          <text fill="url(#accent-grad-light)">
            <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.5;0.53;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            Open Source Contributor
          </text>
        </g>
        
        <rect x="360" y="-16" width="10" height="22" fill="#2563EB" class="cursor"/>
      </g>

      <!-- Details Grid -->
      <g transform="translate(40, 205)" class="font-sans" font-size="14">
        <g class="fade-up" style="animation-delay: 0.6s;">
          <text x="0" y="15" fill="#64748B" class="font-mono" font-size="12">LOCATION</text>
          <text x="140" y="15" fill="#0F172A" font-weight="600">Asansol, India</text>
        </g>
        <g transform="translate(0, 32)" class="fade-up" style="animation-delay: 0.7s;">
          <text x="0" y="15" fill="#64748B" class="font-mono" font-size="12">EDUCATION</text>
          <text x="140" y="15" fill="#0F172A" font-weight="600">B.Tech in Information Technology</text>
        </g>
        <g transform="translate(0, 64)" class="fade-up" style="animation-delay: 0.8s;">
          <text x="0" y="15" fill="#64748B" class="font-mono" font-size="12">CURRENT FOCUS</text>
          <text x="140" y="15" fill="#2563EB" font-weight="600">HireOps (Agentic AI Evaluation SaaS)</text>
        </g>
      </g>

      <!-- Tech Stack Pills -->
      <g transform="translate(40, 335)">
        <text x="0" y="0" fill="#94A3B8" class="font-mono" font-size="11" letter-spacing="1" class="fade-up" style="animation-delay: 0.9s;">
          PRIMARY TECH STACK
        </text>

        <g transform="translate(0, 15)" class="fade-up" style="animation-delay: 1.0s;">
          <!-- Pill 1 -->
          <g transform="translate(0, 0)">
            <rect width="82" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0"/>
            <text x="41" y="19" fill="#0F172A" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Next.js</text>
          </g>
          <!-- Pill 2 -->
          <g transform="translate(90, 0)">
            <rect width="72" height="30" rx="15" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)"/>
            <text x="36" y="19" fill="#0891B2" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">React</text>
          </g>
          <!-- Pill 3 -->
          <g transform="translate(170, 0)">
            <rect width="98" height="30" rx="15" fill="rgba(37,99,235,0.1)" stroke="rgba(37,99,235,0.3)"/>
            <text x="49" y="19" fill="#2563EB" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">TypeScript</text>
          </g>
          <!-- Pill 4 -->
          <g transform="translate(276, 0)">
            <rect width="78" height="30" rx="15" fill="rgba(217,119,6,0.1)" stroke="rgba(217,119,6,0.3)"/>
            <text x="39" y="19" fill="#D97706" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Python</text>
          </g>
          <!-- Pill 5 -->
          <g transform="translate(362, 0)">
            <rect width="64" height="30" rx="15" fill="rgba(220,38,38,0.1)" stroke="rgba(220,38,38,0.3)"/>
            <text x="32" y="19" fill="#DC2626" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Java</text>
          </g>
          <!-- Pill 6 -->
          <g transform="translate(434, 0)">
            <rect width="84" height="30" rx="15" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
            <text x="42" y="19" fill="#059669" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Tailwind</text>
          </g>

          <!-- Row 2 -->
          <g transform="translate(0, 38)">
            <g transform="translate(0, 0)">
              <rect width="92" height="30" rx="15" fill="rgba(147,51,234,0.1)" stroke="rgba(147,51,234,0.3)"/>
              <text x="46" y="19" fill="#9333EA" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">LangGraph</text>
            </g>
            <g transform="translate(100, 0)">
              <rect width="80" height="30" rx="15" fill="rgba(22,163,74,0.1)" stroke="rgba(22,163,74,0.3)"/>
              <text x="40" y="19" fill="#16A34A" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Node.js</text>
            </g>
            <g transform="translate(188, 0)">
              <rect width="90" height="30" rx="15" fill="rgba(13,148,136,0.1)" stroke="rgba(13,148,136,0.3)"/>
              <text x="45" y="19" fill="#0D9488" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
            </g>
            <g transform="translate(286, 0)">
              <rect width="76" height="30" rx="15" fill="rgba(2,132,199,0.1)" stroke="rgba(2,132,199,0.3)"/>
              <text x="38" y="19" fill="#0284C7" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">Docker</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Social Connect Icons -->
      <g transform="translate(40, 468)" class="fade-up" style="animation-delay: 1.1s;">
        <line x1="0" y1="0" x2="602" y2="0" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

        <!-- GitHub -->
        <g transform="translate(0, 18)">
          <circle cx="16" cy="16" r="16" fill="#F1F5F9" stroke="#E2E8F0"/>
          <path d="M16 8a8 8 0 00-2.53 15.59c.4.07.55-.17.55-.38v-1.35c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 014 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .22.15.46.55.38A8 8 0 0016 8z" fill="#0F172A"/>
        </g>

        <!-- LinkedIn -->
        <g transform="translate(48, 18)">
          <circle cx="16" cy="16" r="16" fill="#F1F5F9" stroke="#E2E8F0"/>
          <path d="M11 11h2.5v1.4h.04c.35-.66 1.2-1.35 2.48-1.35 2.65 0 3.14 1.74 3.14 4V21H16.5v-4.3c0-1.02-.02-2.34-1.42-2.34-1.43 0-1.65 1.12-1.65 2.26V21H11V11zM8 21H5.5V11H8v10zM6.75 9.8a1.45 1.45 0 110-2.9 1.45 1.45 0 010 2.9z" fill="#0284C7"/>
        </g>

        <!-- X / Twitter -->
        <g transform="translate(96, 18)">
          <circle cx="16" cy="16" r="16" fill="#F1F5F9" stroke="#E2E8F0"/>
          <path d="M18.25 9h2.38l-5.2 5.94L21.56 23h-4.79l-3.75-4.91L8.72 23H6.33l5.56-6.35L5.69 9h4.91l3.39 4.49L18.25 9zm-.83 12.57h1.32L9.75 10.33H8.33l9.09 11.24z" fill="#0F172A"/>
        </g>

        <text x="590" y="38" fill="#94A3B8" class="font-mono" font-size="11" text-anchor="end">READY TO COLLABORATE</text>
      </g>
    </g>
  </g>
</svg>
